      <circle cx="-22" cy="-4" r="18" fill="url(#rainbow_cloud)"/>
      <circle cx="16" cy="-10" r="21" fill="url(#rainbow_cloud)"/>
      <circle cx="26" cy="0" r="15" fill="url(#rainbow_cloud)"/>
