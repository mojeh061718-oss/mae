  <!-- glossy overlay on the colored ring only -->
  <path d="M110 20 H790 A90 90 0 0 1 880 110 V1090 A90 90 0 0 1 790 1180 H110 A90 90 0 0 1 20 1090 V110 A90 90 0 0 1 110 20 Z
