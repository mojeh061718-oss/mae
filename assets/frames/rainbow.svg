  <g>
    <g transform="translate(120,78)">
      <ellipse cx="0" cy="8" rx="40" ry="24" fill="url(#rainbow_cloud)"/>
      <circle cx="-22" cy="2" r="18" fill="url(#rainbow_cloud)"/>
      <circle cx="16" cy="-4" r="22" fill="url(#rainbow_cloud)"/>
