                            M129 65 A64 64 0 0 0 65 129 V1071 A64 64 0 0 0 129 1135 H771 A64 64 0 0 0 835 1071 V129 A64 64 0 0 0 771 65 Z"/>
    <path fill="#4cd964" d="M129 65 H771 A64 64 0 0 1 835 129 V1071 A64 64 0 0 1 771 1135 H129 A64 64 0 0 1 65 1071 V129 A64 64 0 0 1 129 65 Z
                            M136 80 A56 56 0 0 0 80 136 V1064 A56 56 0 0 0 136 1120 H764 A56 56 0 0 0 820 1064 V136 A56 56 0 0 0 764 80 Z"/>
    <path fill="#3fa9ff" d="M136 80 H764 A56 56 0 0 1 820 136 V1064 A56 56 0 0 1 764 1120 H136 A56 56 0 0 1 80 1064 V136 A56 56 0 0 1 136 80 Z
                            M143 95 A48 48 0 0 0 95 143 V1057 A48 48 0 0 0 143 1105 H757 A48 48 0 0 0 805 1057 V143 A48 48 0 0 0 757 95 Z"/>
    <path fill="#a05cff" d="M143 95 H757 A48 48 0 0 1 805 143 V1057 A48 48 0 0 1 757 1105 H143 A48 48 0 0 1 95 1057 V143 A48 48 0 0 1 143 95 Z
                            M150 110 A40 40 0 0 0 110 150 V1050 A40 40 0 0 0 150 1090 H750 A40 40 0 0 0 790 1050 V150 A40 40 0 0 0 750 110 Z"/>
