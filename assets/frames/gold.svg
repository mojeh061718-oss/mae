<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="gold_band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.25" stop-color="#ffcf3f"/>
      <stop offset="0.5" stop-color="#e39c12"/>
      <stop offset="0.75" stop-color="#ffcf3f"/>
      <stop offset="1" stop-color="#c67f0a"/>
    </linearGradient>
    <linearGradient id="gold_bead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset="1" stop-color="#e0a018"/>
    </linearGradient>
    <filter id="gold_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5a3c00" flood-opacity="0.35"/>
    </filter>
    <g id="gold_flourish">
      <path d="M0,0 C34,-4 58,14 62,44" fill="none" stroke="url(#gold_bead)" stroke-width="7" stroke-linecap="round"/>
      <path d="M0,0 C-4,34 14,58 44,62" fill="none" stroke="url(#gold_bead)" stroke-width="7" stroke-linecap="round"/>
      <path d="M62,44 C74,50 78,64 70,74 C64,66 60,58 62,44 Z" fill="url(#gold_bead)"/>
      <path d="M44,62 C50,74 64,78 74,70 C66,64 58,60 44,62 Z" fill="url(#gold_bead)"/>
      <circle cx="0" cy="0" r="9" fill="url(#gold_bead)"/>
      <circle cx="0" cy="0" r="4" fill="#fff6cf"/>
    </g>
  </defs>

  <!-- Gold band ring, center transparent -->
  <g filter="url(#gold_shadow)">
    <path fill="url(#gold_band)" fill-rule="evenodd"
          d="M80 24 H820 A56 56 0 0 1 876 80 V1120 A56 56 0 0 1 820 1176 H80 A56 56 0 0 1 24 1120 V80 A56 56 0 0 1 80 24 Z
             M148 104 A44 44 0 0 0 104 148 V1052 A44 44 0 0 0 148 1096 H752 A44 44 0 0 0 796 1052 V148 A44 44 0 0 0 752 104 Z"/>
  </g>

  <!-- scalloped/beaded OUTER edge -->
  <path fill="none" stroke="url(#gold_bead)" stroke-width="26" stroke-linecap="round" stroke-dasharray="0.5 44"
        d="M80 24 H820 A56 56 0 0 1 876 80 V1120 A56 56 0 0 1 820 1176 H80 A56 56 0 0 1 24 1120 V80 A56 56 0 0 1 80 24 Z"/>
  <!-- fine bead line along INNER edge -->
  <path fill="none" stroke="url(#gold_bead)" stroke-width="12" stroke-linecap="round" stroke-dasharray="0.5 20"
        d="M148 104 H752 A44 44 0 0 1 796 148 V1052 A44 44 0 0 1 752 1096 H148 A44 44 0 0 1 104 1052 V148 A44 44 0 0 1 148 104 Z"/>

  <!-- highlight & shadow lines for depth -->
  <path fill="none" stroke="#fff6cf" stroke-width="3" opacity="0.7"
        d="M148 104 H752 A44 44 0 0 1 796 148 V1052 A44 44 0 0 1 752 1096 H148 A44 44 0 0 1 104 1052 V148 A44 44 0 0 1 148 104 Z"/>
  <path fill="none" stroke="#8a5a06" stroke-width="2" opacity="0.5"
        d="M158 116 H742 A34 34 0 0 1 776 150 V1050 A34 34 0 0 1 742 1084 H158 A34 34 0 0 1 124 1050 V150 A34 34 0 0 1 158 116 Z"/>

  <!-- corner flourishes -->
  <g filter="url(#gold_shadow)">
    <use href="#gold_flourish" transform="translate(92,92) rotate(180)"/>
    <use href="#gold_flourish" transform="translate(808,92) rotate(270)"/>
    <use href="#gold_flourish" transform="translate(808,1108) rotate(0)"/>
    <use href="#gold_flourish" transform="translate(92,1108) rotate(90)"/>
  </g>
</svg>
