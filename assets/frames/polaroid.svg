<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="polaroid_paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#fdfdfd"/>
      <stop offset="1" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="polaroid_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="polaroid_sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- White polaroid card with thick bottom band; inner window transparent -->
  <path d="M28 28 H872 V1172 H28 Z
           M55 55 V955 H845 V55 Z"
        fill="url(#polaroid_paper)" fill-rule="evenodd" filter="url(#polaroid_shadow)"/>
  <!-- subtle inner outline around the photo window -->
  <rect x="55" y="55" width="790" height="900" fill="none" stroke="#d9d9d9" stroke-width="2"/>
  <rect x="53" y="53" width="794" height="904" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <!-- soft top sheen on the card frame (top band only) -->
  <rect x="40" y="40" width="820" height="10" fill="url(#polaroid_sheen)" opacity="0.6"/>
  <!-- gentle highlight on the thick bottom band -->
  <rect x="70" y="985" width="760" height="60" rx="30" fill="url(#polaroid_sheen)" opacity="0.35"/>
</svg>
