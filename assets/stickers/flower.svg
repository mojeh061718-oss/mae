<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="flower_gPetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5cc8"/>
      <stop offset="1" stop-color="#ff2d6f"/>
    </linearGradient>
    <radialGradient id="flower_gCenter" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff7a00"/>
    </radialGradient>
    <linearGradient id="flower_gLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9be7c4"/>
      <stop offset="1" stop-color="#4cd964"/>
    </linearGradient>
    <radialGradient id="flower_gGloss" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="flower_sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#flower_sh)">
    <!-- Leaf (drawn under, with white outline) -->
    <path d="M100 150 C120 150 150 165 158 190 C132 190 108 178 100 154 Z" fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
    <path d="M100 150 C120 150 150 165 158 190 C132 190 108 178 100 154 Z" fill="url(#flower_gLeaf)"/>
    <path d="M104 158 C122 162 140 174 150 186" fill="none" stroke="#2f9e4a" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <!-- Stem -->
    <path d="M100 152 L100 118" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
    <path d="M100 152 L100 118" fill="none" stroke="#4cd964" stroke-width="6" stroke-linecap="round"/>
    <!-- Petals: white die-cut group -->
    <g stroke="#fff" stroke-width="10" stroke-linejoin="round">
      <ellipse cx="100" cy="46" rx="24" ry="34" fill="url(#flower_gPetal)"/>
      <ellipse cx="100" cy="46" rx="24" ry="34" fill="url(#flower_gPetal)" transform="rotate(72 100 100)"/>
      <ellipse cx="100" cy="46" rx="24" ry="34" fill="url(#flower_gPetal)" transform="rotate(144 100 100)"/>
      <ellipse cx="100" cy="46" rx="24" ry="34" fill="url(#flower_gPetal)" transform="rotate(216 100 100)"/>
      <ellipse cx="100" cy="46" rx="24" ry="34" fill="url(#flower_gPetal)" transform="rotate(288 100 100)"/>
    </g>
    <!-- Petal gloss -->
    <ellipse cx="100" cy="36" rx="12" ry="16" fill="url(#flower_gGloss)" opacity="0.6"/>
    <!-- Center -->
    <circle cx="100" cy="100" r="30" fill="none" stroke="#fff" stroke-width="8"/>
    <circle cx="100" cy="100" r="30" fill="url(#flower_gCenter)"/>
    <!-- Texture dots -->
    <g fill="#c96a00" opacity="0.55">
      <circle cx="92" cy="92" r="3"/><circle cx="104" cy="90" r="3"/><circle cx="112" cy="100" r="3"/>
      <circle cx="98" cy="104" r="3"/><circle cx="110" cy="110" r="3"/><circle cx="90" cy="106" r="3"/>
      <circle cx="100" cy="98" r="3"/><circle cx="106" cy="106" r="3"/>
    </g>
    <ellipse cx="92" cy="90" rx="10" ry="7" fill="#fff" opacity="0.5"/>
  </g>
</svg>
