      <stop offset="0" stop-color="#ff7a8f"/>
      <stop offset="0.5" stop-color="#ff3b3b"/>
      <stop offset="1" stop-color="#d61e4c"/>
    </radialGradient>
    <linearGradient id="balloon_gKnot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b3b"/>
      <stop offset="1" stop-color="#c01838"/>
    </linearGradient>
    <radialGradient id="balloon_gGloss" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="balloon_sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.28"/>
