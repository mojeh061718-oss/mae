  </defs>
  <g filter="url(#balloon_sh)">
    <!-- String -->
    <path d="M90 196 C82 214 100 224 92 238 C86 248 96 254 90 258" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
    <path d="M90 196 C82 214 100 224 92 238 C86 248 96 254 90 258" fill="none" stroke="#ff2d6f" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Balloon body with white die-cut -->
    <path d="M90 20 C130 20 156 52 156 96 C156 140 124 184 90 190 C56 184 24 140 24 96 C24 52 50 20 90 20 Z" fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
    <path d="M90 20 C130 20 156 52 156 96 C156 140 124 184 90 190 C56 184 24 140 24 96 C24 52 50 20 90 20 Z" fill="url(#balloon_gBody)"/>
