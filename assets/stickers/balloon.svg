    <ellipse cx="66" cy="62" rx="20" ry="30" fill="url(#balloon_gGloss)" opacity="0.85" transform="rotate(-20 66 62)"/>
    <ellipse cx="112" cy="140" rx="8" ry="16" fill="#fff" opacity="0.3"/>
