      <stop offset="0%" stop-color="#c78bff"/>
      <stop offset="50%" stop-color="#a05cff"/>
      <stop offset="100%" stop-color="#ff5cc8"/>
    </linearGradient>
    <linearGradient id="roundsunnies_frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a55"/>
      <stop offset="100%" stop-color="#1a1a22"/>
