    <circle cx="308" cy="100" r="60" fill="url(#roundsunnies_frame)"/>
    <circle cx="308" cy="100" r="49" fill="url(#roundsunnies_lens)"/>
    <path d="M276 68 Q294 62 316 70 Q294 78 280 98 Q270 82 276 68 Z" fill="#fff" opacity="0.42"/>
